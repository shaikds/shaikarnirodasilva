services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: groupbuy
      POSTGRES_PASSWORD: groupbuy_dev_password
      POSTGRES_DB: groupbuy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groupbuy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
