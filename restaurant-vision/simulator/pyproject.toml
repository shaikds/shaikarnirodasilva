[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rv-sim"
version = "0.1.0"
description = "Synthetic restaurant scenarios and evaluation for Restaurant Vision."
requires-python = ">=3.11"
dependencies = [
    "rv-contracts",
    "rv-edge",
    "pydantic>=2.7",
    "pyyaml>=6",
    "tzdata; sys_platform == 'win32'",
]

[tool.hatch.build.targets.wheel]
packages = ["rv_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
# rv_edge ships no py.typed marker yet; analyze it anyway (rv_sim only imports its seams).
module = ["rv_edge", "rv_edge.*"]
follow_untyped_imports = true

[project.scripts]
rv-sim = "rv_sim.cli:main"

[tool.ruff.lint.isort]
known-first-party = ["rv_sim", "conftest"]
