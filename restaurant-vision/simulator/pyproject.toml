[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rv-sim"
version = "0.1.0"
description = "Synthetic restaurant scenarios and evaluation for Restaurant Vision."
requires-python = ">=3.11"
dependencies = [
    "rv-contracts",
    "rv-edge",
    "numpy>=1.26",
    "pyyaml>=6",
]

[tool.hatch.build.targets.wheel]
packages = ["rv_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[project.scripts]
rv-sim = "rv_sim.cli:main"
