# Restaurant Vision demo / dev stack: Postgres + cloud (API, dashboard, waiter PWA) + a simulated
# edge. Use deploy/scripts/demo-up.sh, which seeds the demo tenant and pairs the edge for you.
#
#   docker compose -f deploy/docker-compose.yml up -d --wait db cloud      # cloud only
#   deploy/scripts/demo-up.sh                                              # full demo
#   deploy/scripts/demo-down.sh [--purge]
#
# deploy/.env (git-ignored; demo-up.sh creates it with fresh secrets) is read twice: by Compose
# for the ${...} values below, and by the cloud container (env_file) for its RV_* settings:
#   RV_JWT_SECRET, RV_VAPID_PRIVATE_KEY, RV_VAPID_PUBLIC_KEY, RV_VAPID_SUBJECT, RV_DB_PASSWORD
# Other variables (shell or deploy/.env):
#   RV_CLOUD_PORT (8000), RV_EDGE_PORT (8787), RV_SIM_SPEED (20), RV_ENVIRONMENT (dev)
#   RV_PAIR_CODE (set by demo-up.sh), RV_SCENARIO (simulator/scenarios/demo_dinner.yaml)
#   RV_PYTHON_IMAGE, RV_NODE_IMAGE, RV_POSTGRES_IMAGE (registry mirrors)

name: restaurant-vision

x-build-args: &build-args
  PYTHON_IMAGE: ${RV_PYTHON_IMAGE:-python:3.12-slim}
  NODE_IMAGE: ${RV_NODE_IMAGE:-node:22-slim}

services:
  db:
    image: ${RV_POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: rv
      POSTGRES_PASSWORD: ${RV_DB_PASSWORD:-rv-demo-db-password}
      POSTGRES_DB: rv
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rv -d rv"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cloud:
    build:
      context: ..
      dockerfile: deploy/docker/cloud.Dockerfile
      args: *build-args
    image: restaurant-vision/cloud:dev
    depends_on:
      db:
        condition: service_healthy
    # Secrets: RV_JWT_SECRET and RV_VAPID_* (demo-up.sh writes them). Without the file the
    # cloud uses its dev-only JWT secret (refused when RV_ENVIRONMENT=production) and Web Push
    # stays off.
    env_file:
      - path: .env
        required: false
    environment:
      RV_DATABASE_URL: postgresql+psycopg://rv:${RV_DB_PASSWORD:-rv-demo-db-password}@db:5432/rv
      RV_ENVIRONMENT: ${RV_ENVIRONMENT:-dev}
      RV_LOG_JSON: ${RV_LOG_JSON:-false}
      RV_LOG_LEVEL: ${RV_LOG_LEVEL:-INFO}
    ports:
      - "${RV_CLOUD_PORT:-8000}:8000"
    restart: unless-stopped

  # Simulated restaurant: rv-edge runs a simulator scenario at speed and sends events to the
  # cloud. Started by demo-up.sh with a fresh pairing code (a code works once).
  edge-sim:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deploy/docker/edge.Dockerfile
      args: *build-args
    image: restaurant-vision/edge:dev
    depends_on:
      cloud:
        condition: service_healthy
    init: true
    command:
      - simulate
      - --scenario
      - ${RV_SCENARIO:-simulator/scenarios/demo_dinner.yaml}
      - --speed
      - "${RV_SIM_SPEED:-20}"
      - --cloud
      - http://cloud:8000
      - --pair-code
      - "${RV_PAIR_CODE:-}"
    ports:
      - "${RV_EDGE_PORT:-8787}:8787"
    restart: "no"

volumes:
  pgdata:
