[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rv-contracts"
version = "0.1.0"
description = "Shared data contracts for Restaurant Vision."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["rv_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
