[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rv-edge"
version = "0.1.0"
description = "On-site edge engine for Restaurant Vision."
requires-python = ">=3.11"
dependencies = [
    "rv-contracts",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "onnxruntime>=1.18",
    "scipy>=1.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
    "psutil>=5.9",
]

[tool.hatch.build.targets.wheel]
packages = ["rv_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[project.scripts]
rv-edge = "rv_edge.runtime.cli:main"
