# Alembic config for rv_cloud. Run from restaurant-vision/cloud:
#   alembic upgrade head                      (uses RV_DATABASE_URL, default sqlite file)
#   alembic -x url=postgresql+psycopg://... upgrade head
[alembic]
script_location = %(here)s/rv_cloud/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
