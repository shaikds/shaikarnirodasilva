[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rv-cloud"
version = "0.1.0"
description = "Multi-tenant cloud backend for Restaurant Vision."
requires-python = ">=3.11"
dependencies = [
    "rv-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "pywebpush>=2.0",
    "cryptography>=42",
    "httpx>=0.27",
    "email-validator>=2.1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "mypy>=1.10",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["rv_cloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:rv_cloud.*",
]

[tool.coverage.run]
source = ["rv_cloud"]
omit = ["rv_cloud/migrations/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pywebpush", "pywebpush.*", "py_vapid", "py_vapid.*"]
ignore_missing_imports = true
