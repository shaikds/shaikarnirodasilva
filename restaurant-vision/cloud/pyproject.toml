[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rv-cloud"
version = "0.1.0"
description = "Multi-tenant cloud backend for Restaurant Vision."
requires-python = ">=3.11"
dependencies = [
    "rv-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "pywebpush>=2.0",
    "httpx>=0.27",
    "email-validator>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["rv_cloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
