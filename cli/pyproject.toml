[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-export"
version = "0.1.0"
description = "Own your AI data: export, normalize, and re-inject conversations across LLM services."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
all = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
ai-export = "ai_export.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ai_export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
