<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Backup System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>Universal Backup System</h1>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="App.showCreateModal()">+ New Project</button>
                <button class="theme-toggle" id="theme-btn" onclick="App.toggleTheme()"
                    title="Toggle theme">&#9788;</button>
            </div>
        </header>

        <!-- Alert area -->
        <div id="alert-root"></div>

        <!-- Main content (rendered by app.js) -->
        <main id="app-root">
            <div class="empty-state">
                <p>Loading...</p>
            </div>
        </main>
    </div>

    <!-- Modal container -->
    <div id="modal-root"></div>

    <!-- Scripts (order matters: api -> components -> app) -->
    <script src="js/api.js"></script>
    <script src="js/components.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
